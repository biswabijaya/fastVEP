name: Deploy Enigma production
on:
  push:
    branches: [prod-enigma]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: fastvep-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/prod-enigma'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/903636395933/locations/global/workloadIdentityPools/github/providers/fastvep
          service_account: fastvep-deploy@enigmagenomics.iam.gserviceaccount.com
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --yes firebase-tools@15.35.0 deploy --only apphosting --project enigmagenomics --non-interactive
